; Custom PHP-FPM pool config — overrides the php:8.3-fpm base image's
; default www.conf, which ships with pm.max_children = 5 (the whole app,
; across every portal, could only serve 5 concurrent requests at once).
; See docs/CONCURRENT-LOAD-AUDIT-2026-10.md section 3.
;
; 20 workers is a starting point sized for a small-to-mid container; raise
; it if the deploy has more RAM to spare, lower it if workers start getting
; OOM-killed. Each PHP-FPM worker for this app runs roughly 30-60MB.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

clear_env = no
